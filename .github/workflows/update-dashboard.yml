name: Update Snow Drought Dashboard

on:
  # Run once daily at 6am PST / 7am PDT (2pm UTC)
  schedule:
    - cron: '0 14 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download HUC6 data (PREC and WTEQ)
        run: |
          echo "Downloading HUC6 precipitation and SWE data..."
          python scripts/download_data.py
      
      - name: Download SNOTEL station data
        run: |
          echo "Downloading SNOTEL station data..."
          python scripts/download_snotel_data.py
      
      - name: Process SNOTEL data
        run: |
          echo "Processing SNOTEL data..."
          python scripts/process_snotel_data.py
      
      - name: Generate phase diagrams
        run: |
          echo "Generating phase diagrams..."
          python scripts/generate_plots.py
      
      - name: Generate snow drought condition plots
        run: |
          echo "Generating snow drought plots..."
          python scripts/generate_snow_drought_plots_new.py
      
      - name: Prepare deployment
        run: |
          # Create deployment directory with plots at root level
          mkdir -p deployment
          cp index.html deployment/
          
          # Copy plots subdirectories to root of deployment (not wrapped in plots/)
          cp -r plots/phase_diagrams deployment/
          cp -r plots/snow_drought_conditions deployment/
          
          # Copy supporting files
          cp -r logo/ deployment/
          mkdir -p deployment/data
          cp data/snotel_100day_nov1_precipitation_percentiles.csv deployment/data/
          cp data/snotel_current_swe_percentiles.csv deployment/data/
          cp data/snotel_station_list.csv deployment/data/
          
          # Update last modified timestamp
          date > deployment/last_updated.txt
          
          echo "Deployment structure:"
          ls -la deployment/ | head -20
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deployment
          force_orphan: true
      
      - name: Commit processed data to main branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/*.csv
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update processed data - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      
      - name: Summary
        run: |
          echo "✅ Dashboard update complete!"
          echo "📊 Phase diagrams: $(ls -1 plots/phase_diagrams/*.png 2>/dev/null | wc -l) files"
          echo "🗺️ Snow drought plots: $(ls -1 plots/snow_drought_conditions/*.png 2>/dev/null | wc -l) files"
